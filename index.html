<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Local WebRTC Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .chat-card { width: 100%; max-width: 480px; background: #1e293b; border-radius: 12px; padding: 20px; }
    h2 { margin-top: 0; color: #38bdf8; text-align: center; }
    .id-box { background: #0f172a; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 1rem; color: #38bdf8; word-break: break-all; margin-bottom: 12px; text-align: center; }
    #chat-box { height: 300px; overflow-y: auto; border: 1px solid #334155; padding: 12px; border-radius: 8px; background: #0f172a; margin: 12px 0; display: flex; flex-direction: column; gap: 8px; }
    .msg { background: #334155; padding: 8px 12px; border-radius: 8px; max-width: 85%; }
    .msg strong { color: #38bdf8; display: block; font-size: 0.8rem; }
    input, button { padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    .row input { flex: 1; }
    button { background: #0284c7; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="chat-card">
    <h2>Local Chatroom</h2>
    <div class="id-box">Your ID: <span id="my-id">Connecting...</span></div>

    <div class="row">
      <input type="text" id="peer-id-input" placeholder="Enter Friend's Peer ID" />
      <button onclick="connectToPeer()">Connect</button>
    </div>

    <div id="chat-box"></div>

    <div class="row">
      <input type="text" id="username" placeholder="Name" value="User1" style="width: 30%;" />
      <input type="text" id="message-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMsg()" />
      <button onclick="sendMsg()">Send</button>
    </div>
  </div>

  <script>
    let peer = new Peer();
    let conn = null;

    peer.on('open', (id) => {
      document.getElementById('my-id').innerText = id;
    });

    peer.on('connection', (connection) => {
      conn = connection;
      setupConnection();
    });

    function connectToPeer() {
      const friendId = document.getElementById('peer-id-input').value.trim();
      if (!friendId) return alert('Enter a Peer ID first!');
      conn = peer.connect(friendId);
      setupConnection();
    }

    function setupConnection() {
      conn.on('open', () => {
        appendMessage('System', 'Connected directly!');
      });

      conn.on('data', (data) => {
        appendMessage(data.user, data.text);
      });
    }

    function sendMsg() {
      const name = document.getElementById('username').value.trim() || 'Anon';
      const input = document.getElementById('message-input');
      const text = input.value.trim();

      if (!text || !conn) return alert('Connect to a peer first!');

      conn.send({ user: name, text: text });
      appendMessage('You (' + name + ')', text);
      input.value = '';
    }

    function appendMessage(sender, text) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<strong>${sender}</strong> ${text}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
